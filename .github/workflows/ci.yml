name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace

  conformance:
    # Every SDK runs the same vectors through the same harness. This is the
    # cross-implementation reproducibility acceptance — the thing that makes
    # "identical bytes across languages" a test rather than a hope — so it must
    # run on every change, not on release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must request the same components as rust-toolchain.toml. Without this the
      # minimal profile lands first and the mid-build component sync fails with
      # "detected conflict: bin/cargo-fmt".
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python SDK dependencies
        run: python -m pip install --disable-pip-version-check blake3 cryptography
      - name: Build the Rust adapter
        run: cargo build -p rcx-verify --bin rcx-verify-adapter
      - name: Conformance — Rust reference SDK
        run: ./scripts/conformance-harness.py --adapter "./target/debug/rcx-verify-adapter"
      - name: Conformance — Python SDK
        run: ./scripts/conformance-harness.py --adapter "python3 sdks/python/adapter.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript SDK dependencies
        run: npm ci --no-audit --no-fund
        working-directory: sdks/typescript
      - name: Conformance — TypeScript SDK
        run: ./scripts/conformance-harness.py --adapter "node sdks/typescript/adapter.mjs"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sdks/go/go.sum
      - name: Vet and build the Go adapter
        run: |
          go vet ./...
          go build -o adapter-bin ./cmd/adapter
        working-directory: sdks/go
      - name: Conformance — Go SDK
        run: ./scripts/conformance-harness.py --adapter "sdks/go/adapter-bin"

  frontdoor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontdoor/pnpm-lock.yaml
      - name: Install frontdoor dependencies
        working-directory: frontdoor
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for client-navigation smoke
        working-directory: frontdoor
        run: pnpm exec playwright install --with-deps chromium
      - name: Test frontdoor source assets
        working-directory: frontdoor
        run: pnpm test && pnpm test:spec-freeze
      - name: Build frontdoor
        working-directory: frontdoor
        run: pnpm build
      - name: Smoke built routes and exact vectors
        working-directory: frontdoor
        run: pnpm test:built
